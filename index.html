<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCSB Welcome Night 抽奖</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Songti SC', 'STXingkai', 'Kaiti SC', 'KaiTi', 'STKaiti', 'BiauKai', '楷体', serif;
        background-image: url('image.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        z-index: 0;
      }

      #fireworks {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .container {
        position: relative;
        z-index: 3;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        text-align: center;
        color: #8b4513;
        text-shadow:
          3px 3px 6px rgba(0, 0, 0, 0.7),
          0 0 10px rgba(255, 215, 0, 0.5);
        margin-bottom: 30px;
        padding-top: 40px;
      }

      .header h1 {
        font-size: 48px;
        margin-bottom: 10px;
        color: #4f361b;
        animation: glow 2s ease-in-out infinite;
        padding: 15px 30px;
        border-radius: 20px;
        display: inline-block;
        background: rgba(255, 215, 200, 0.6);
        box-shadow:
          0 0 30px rgba(255, 215, 0, 0.6),
          inset 0 0 20px rgba(255, 215, 0, 0.3);
      }

      button {
        font-family:
          'Songti SC', 'STXingkai', 'Kaiti SC', 'KaiTi', 'STKaiti', 'BiauKai', '楷体', serif;
        transform: translateY(0px);
      }

      @keyframes glow {
        0%,
        100% {
          text-shadow:
            3px 3px 6px rgba(0, 0, 0, 0.7),
            0 0 15px rgba(255, 215, 0, 0.6);
          border-color: #8b4513;
          box-shadow:
            0 0 30px rgba(255, 215, 0, 0.6),
            inset 0 0 20px rgba(255, 215, 0, 0.3);
        }
        50% {
          text-shadow:
            3px 3px 6px rgba(0, 0, 0, 0.7),
            0 0 25px rgba(255, 215, 0, 0.8);
          border-color: #a0522d;
          box-shadow:
            0 0 40px rgba(255, 215, 0, 0.8),
            inset 0 0 30px rgba(255, 215, 0, 0.4);
        }
      }

      .header p {
        color: #5c3317;
        text-shadow:
          2px 2px 4px rgba(0, 0, 0, 0.7),
          0 0 10px rgba(255, 215, 0, 0.5);
      }

      .menu-wrap {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
      }

      .menu-btn {
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.4);
        color: #5c3317;
        border: 2px solid rgba(139, 69, 19, 0.6);
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
      }

      .menu-btn:hover {
        background: rgba(255, 215, 0, 0.5);
        transform: scale(1.05);
        border-color: #8b4513;
      }

      .menu-dropdown {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 280px;
        background: rgba(255, 255, 255, 0.92);
        border: 2px solid rgba(139, 69, 19, 0.5);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        overflow: hidden;
      }

      .menu-dropdown.open {
        display: block;
      }

      .menu-dropdown button {
        display: block;
        width: 100%;
        padding: 12px 16px;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(139, 69, 19, 0.2);
        color: #5c3317;
        font-size: 14px;
        font-weight: bold;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s;
      }

      .menu-dropdown > button:hover {
        background: rgba(255, 215, 0, 0.35);
      }

      .menu-history {
        border-top: 1px solid rgba(139, 69, 19, 0.2);
        padding: 10px 12px 12px;
        max-height: 280px;
        overflow-y: auto;
      }

      .menu-history h4 {
        color: #5c3317;
        font-size: 13px;
        margin-bottom: 8px;
      }

      .menu-history .history-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu-history .history-item {
        background: rgba(255, 215, 0, 0.18);
        border: 1px solid rgba(139, 69, 19, 0.25);
        border-radius: 8px;
        padding: 8px 10px;
        color: #5c3317;
        font-size: 12px;
        line-height: 1.4;
      }

      .menu-history .history-item strong {
        color: #8b0000;
      }

      .menu-history .empty {
        color: #7a5a3a;
        font-size: 12px;
      }

      .audio-control {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.4);
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(139, 69, 19, 0.4);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .play-stop-btn {
        width: 40px;
        height: 40px;
        background: rgba(139, 69, 19, 0.6);
        border: 2px solid #8b4513;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: all 0.3s;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .play-stop-btn:hover {
        background: rgba(139, 69, 19, 0.8);
        transform: scale(1.1);
      }

      .play-stop-btn:active {
        transform: scale(0.95);
      }

      .volume-slider {
        width: 100px;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: rgba(139, 69, 19, 0.3);
        outline: none;
        border-radius: 3px;
        cursor: pointer;
      }

      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: #8b4513;
        cursor: pointer;
        border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      .volume-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        background: #8b4513;
        cursor: pointer;
        border-radius: 50%;
        border: none;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      .audio-control label {
        color: #5c3317;
        font-size: 14px;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        min-width: 35px;
      }

      .fetch-section {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.4);
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        max-width: 240px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(139, 69, 19, 0.4);
      }

      .fetch-info {
        color: #5c3317;
        font-size: 12px;
        margin-bottom: 10px;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
      }

      .candidates-info {
        background: rgba(255, 215, 0, 0.2);
        padding: 0;
        border-radius: 8px;
        margin-bottom: 10px;
        border: 2px solid rgba(139, 69, 19, 0.5);
        overflow: hidden;
      }

      .candidates-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px;
        background: transparent;
        border: none;
        color: #5c3317;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        text-align: left;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
      }

      .candidates-toggle:hover {
        background: rgba(255, 215, 0, 0.2);
      }

      .candidates-toggle .chevron {
        flex-shrink: 0;
        transition: transform 0.2s;
      }

      .candidates-info.expanded .candidates-toggle .chevron {
        transform: rotate(180deg);
      }

      .candidates-details {
        display: none;
        padding: 0 8px 8px;
        border-top: 1px solid rgba(139, 69, 19, 0.3);
      }

      .candidates-info.expanded .candidates-details {
        display: block;
      }

      .candidates-info p {
        color: #5c3317;
        font-size: 11px;
        margin: 6px 0 0;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
      }

      .fetch-btn {
        width: 100%;
        padding: 10px;
        background: rgba(220, 20, 60, 0.5);
        color: #ffffff;
        border: 2px solid rgba(139, 0, 0, 0.6);
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      .fetch-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        background: rgba(220, 20, 60, 0.7);
      }

      .fetch-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .notification {
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 215, 0, 0.5);
        color: #5c3317;
        padding: 15px 30px;
        border-radius: 10px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        display: none;
        animation: slideDown 0.5s ease-out;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(139, 69, 19, 0.6);
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.7);
        max-width: 90vw;
        text-align: center;
      }

      @keyframes slideDown {
        from {
          top: -100px;
          opacity: 0;
        }
        to {
          top: 100px;
          opacity: 1;
        }
      }

      .lottery-section {
        background: rgba(255, 255, 255, 0.4);
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        margin-top: auto;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.6);
      }

      .prize-panel {
        text-align: center;
        margin-bottom: 20px;
        padding: 16px 20px;
        background: rgba(255, 215, 0, 0.25);
        border: 2px solid rgba(139, 69, 19, 0.5);
        border-radius: 14px;
      }

      .prize-panel .label {
        color: #5c3317;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
      }

      .prize-panel .prize-level {
        color: #8b0000;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 4px;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
      }

      .prize-panel .prize-name {
        color: #5c3317;
        font-size: 18px;
        margin-bottom: 6px;
      }

      .prize-panel .prize-count {
        color: #5c3317;
        font-size: 15px;
        font-weight: bold;
      }

      .prize-panel .idle {
        color: #5c3317;
        font-size: 16px;
        font-weight: bold;
      }

      .slot-machine {
        display: none;
        margin: 30px 0;
      }

      .slot-container {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .slot {
        background: rgba(255, 255, 255, 0.95);
        border: 4px solid #8b4513;
        border-radius: 15px;
        padding: 20px 14px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        flex: 0 1 220px;
        min-width: 160px;
        max-width: 280px;
      }

      .slot-name {
        font-weight: bold;
        color: #dc143c;
        margin-bottom: 10px;
        min-height: 40px;
        animation: rolling 0.1s linear infinite;
        overflow: hidden;
        text-overflow: ellipsis;
        word-wrap: break-word;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      @keyframes rolling {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-10px);
        }
      }

      .slot-email {
        font-size: 12px;
        color: #666;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
      }

      .draw-btn {
        width: 100%;
        padding: 20px;
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.7) 0%, rgba(255, 165, 0, 0.7) 100%);
        color: #5c3317;
        border: 3px solid #8b4513;
        border-radius: 15px;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        margin-top: 20px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .draw-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow:
          0 8px 25px rgba(0, 0, 0, 0.4),
          0 0 20px rgba(255, 215, 0, 0.6);
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.9) 0%, rgba(255, 165, 0, 0.9) 100%);
      }

      .draw-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .results {
        display: none;
        margin-top: 20px;
        margin-bottom: 20px;
      }

      .results h2 {
        color: #5c3317;
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
        text-shadow:
          2px 2px 4px rgba(255, 255, 255, 0.7),
          0 0 10px rgba(255, 215, 0, 0.5);
      }

      .winners-grid {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .winner-card {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.9) 0%, rgba(255, 165, 0, 0.9) 100%);
        padding: 16px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        animation: fadeIn 0.5s ease-out;
        flex: 0 1 220px;
        min-width: 160px;
        max-width: 280px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 3px solid #8b4513;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .winner-card h3 {
        color: #5c3317;
        font-weight: bold;
        margin-bottom: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        word-wrap: break-word;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        font-size: 20px;
        text-align: center;
      }

      .winner-card p {
        color: #333;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.3);
        text-align: center;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 2000;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        max-width: 400px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .modal-content h2 {
        color: #8b0000;
        margin-bottom: 20px;
      }

      .modal-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
      }

      .modal-btn {
        padding: 12px 30px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }

      .confirm-btn {
        background: rgba(220, 20, 60, 0.8);
        color: white;
      }

      .cancel-btn {
        background: rgba(204, 204, 204, 0.8);
        color: #333;
      }

      .modal-btn:hover {
        transform: scale(1.05);
      }

      @media (max-width: 768px) {
        .fetch-section {
          max-width: 180px;
          padding: 12px;
        }

        .fetch-info {
          font-size: 11px;
        }

        .candidates-info p {
          font-size: 10px;
        }

        .fetch-btn {
          font-size: 12px;
          padding: 8px;
        }

        .menu-btn {
          padding: 8px 16px;
          font-size: 12px;
        }

        .audio-control {
          padding: 10px;
        }

        .volume-slider {
          width: 80px;
        }

        .play-stop-btn {
          width: 35px;
          height: 35px;
          font-size: 18px;
        }

        .header h1 {
          font-size: 32px;
          padding: 10px 20px;
        }

        .prize-panel .prize-level {
          font-size: 22px;
        }

        .prize-panel .prize-name {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fireworks"></canvas>

    <div class="fetch-section">
      <div class="fetch-info">同步名单与奖品</div>
      <div class="candidates-info" id="candidatesInfo" style="display: none">
        <button
          type="button"
          class="candidates-toggle"
          id="candidatesToggle"
          onclick="toggleCandidatesInfo()"
          aria-expanded="false"
        >
          <span>有效候选人：<span id="validCount">0</span> 人</span>
          <span class="chevron">▾</span>
        </button>
        <div class="candidates-details" id="candidatesDetails">
          <p>剩余可抽：<span id="availableCount">0</span> 人</p>
          <p>已抽取：<span id="drawnCount">0</span> 人</p>
          <p>奖品档次：<span id="prizeTierCount">0</span></p>
        </div>
      </div>
      <button class="fetch-btn" id="syncBtn" onclick="syncData()">🔄 同步数据</button>
    </div>

    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" onclick="toggleMenu(event)">⚙️ 更多操作 ▾</button>
      <div class="menu-dropdown" id="menuDropdown">
        <button type="button" onclick="exportPrizeResultsCsv()">导出抽奖结果 CSV</button>
        <button type="button" onclick="showClearModal()">清除抽奖数据</button>
        <div class="menu-history" id="historySection">
          <h4>已开奖记录</h4>
          <div class="history-list" id="historyList">
            <p class="empty">暂无开奖记录</p>
          </div>
        </div>
      </div>
    </div>

    <div class="audio-control">
      <button class="play-stop-btn" id="playStopBtn" onclick="toggleAudio()">▶️</button>
      <input type="range" min="0" max="100" value="50" class="volume-slider" id="volumeSlider" />
      <label id="volumeLabel">50%</label>
    </div>

    <div class="notification" id="notification"></div>

    <div class="modal" id="clearModal">
      <div class="modal-content">
        <h2>⚠️ 确认清除</h2>
        <p>确定要清除当前抽奖数据吗？<br />将清空 localStorage 中的中奖记录，并从最低奖项重新开始。</p>
        <div class="modal-buttons">
          <button class="modal-btn confirm-btn" onclick="confirmClear()">确认清除</button>
          <button class="modal-btn cancel-btn" onclick="closeClearModal()">取消</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="header">
        <h1>🎊 幸运抽奖 🎊</h1>
        <p style="font-size: 20px">UCSB Welcome Night</p>
      </div>

      <div class="lottery-section">
        <div class="prize-panel" id="prizePanel">
          <p class="idle" id="prizeIdle">请先点击左上角「同步数据」</p>
          <div id="prizeActive" style="display: none">
            <div class="label">当前抽取奖项</div>
            <div class="prize-level" id="currentPrizeLevel"></div>
            <div class="prize-name" id="currentPrizeName"></div>
            <div class="prize-count">抽取人数：<span id="currentPrizeCount">0</span></div>
          </div>
          <div id="prizeDone" style="display: none">
            <p class="idle">🎉 全部奖项已抽取完毕</p>
          </div>
        </div>

        <div class="slot-machine" id="slotMachine">
          <div class="slot-container" id="slotContainer"></div>
        </div>

        <div class="results" id="results">
          <h2 id="resultsTitle">🎉 中奖名单 🎉</h2>
          <div class="winners-grid" id="winnersList"></div>
        </div>

        <button class="draw-btn" id="drawBtn" onclick="onDrawBtnClick()" disabled>🎰 开始抽奖</button>
      </div>
    </div>

    <audio id="lotteryMusic" loop>
      <source src="audio.mp3" type="audio/mpeg" />
    </audio>

    <script>
      const STORAGE_KEY = 'ucsbWelcomeNightLottery';

      let prizeListUrl = '';
      let candidateListUrl = '';

      // prizes as listed in the sheet (top → bottom = high → low)
      let prizes = [];
      // drawing order: lowest first (sheet bottom → top)
      let drawOrder = [];
      let currentDrawIndex = 0;

      let allValidCandidates = [];
      let availableCandidates = [];
      // [{ level, name, count, winners: [{name,email}] }]
      let lotteryResults = [];

      let isDrawing = false;
      let showingResults = false;
      let rollingInterval;
      let isAudioPlaying = false;
      let fireworksActive = false;
      let fireworkInterval;
      let animationFrameId;

      document.addEventListener('DOMContentLoaded', function () {
        loadLotteryState();
        initFireworks();
        updateUI();
        initAudioControl();

        document.addEventListener('click', function (e) {
          const wrap = document.querySelector('.menu-wrap');
          if (wrap && !wrap.contains(e.target)) {
            document.getElementById('menuDropdown').classList.remove('open');
          }
        });
      });

      function initAudioControl() {
        const music = document.getElementById('lotteryMusic');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');
        music.volume = volumeSlider.value / 100;
        volumeSlider.addEventListener('input', function () {
          music.volume = this.value / 100;
          volumeLabel.textContent = this.value + '%';
        });
      }

      function toggleAudio() {
        const music = document.getElementById('lotteryMusic');
        const playStopBtn = document.getElementById('playStopBtn');
        if (isAudioPlaying) {
          music.pause();
          playStopBtn.textContent = '▶️';
          isAudioPlaying = false;
        } else {
          music
            .play()
            .then(() => {
              playStopBtn.textContent = '⏸️';
              isAudioPlaying = true;
            })
            .catch((error) => {
              console.log('Audio play failed:', error);
              showNotification('❌ 音频播放失败');
            });
        }
      }

      function toggleMenu(event) {
        event.stopPropagation();
        document.getElementById('menuDropdown').classList.toggle('open');
      }

      function closeMenu() {
        document.getElementById('menuDropdown').classList.remove('open');
      }

      function toggleCandidatesInfo() {
        const info = document.getElementById('candidatesInfo');
        const toggle = document.getElementById('candidatesToggle');
        const expanded = info.classList.toggle('expanded');
        toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      }

      function onDrawBtnClick() {
        if (showingResults) {
          prepareNextDraw();
          return;
        }
        startLottery();
      }

      function prepareNextDraw() {
        showingResults = false;
        document.getElementById('results').style.display = 'none';
        document.getElementById('slotMachine').style.display = 'none';
        updateUI();
      }

      function parseEnv(text) {
        const config = {};
        text.split(/\r?\n/).forEach((line) => {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#')) return;
          const eq = trimmed.indexOf('=');
          if (eq === -1) return;
          const key = trimmed.slice(0, eq).trim();
          const value = trimmed.slice(eq + 1).trim();
          if (key) config[key] = value;
        });
        return config;
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (c === '"' && next === '"') {
              field += '"';
              i++;
            } else if (c === '"') {
              inQuotes = false;
            } else {
              field += c;
            }
          } else if (c === '"') {
            inQuotes = true;
          } else if (c === ',') {
            row.push(field.trim());
            field = '';
          } else if (c === '\n' || c === '\r') {
            if (c === '\r' && next === '\n') i++;
            row.push(field.trim());
            field = '';
            if (row.some((cell) => cell !== '')) rows.push(row);
            row = [];
          } else {
            field += c;
          }
        }

        if (field.length > 0 || row.length > 0) {
          row.push(field.trim());
          if (row.some((cell) => cell !== '')) rows.push(row);
        }

        return rows;
      }

      function candidateKey(name, email) {
        return `${name.trim().toLowerCase()}|${email.trim().toLowerCase()}`;
      }

      function parsePrizes(csvText) {
        const rows = parseCsv(csvText);
        if (rows.length < 2) return [];
        const list = [];
        for (let i = 1; i < rows.length; i++) {
          const level = (rows[i][0] || '').trim();
          const name = (rows[i][1] || '').trim();
          const count = parseInt((rows[i][2] || '').trim(), 10);
          if (!level || !name || !Number.isFinite(count) || count <= 0) continue;
          list.push({ level, name, count });
        }
        return list;
      }

      function parseCandidates(csvText) {
        const rows = parseCsv(csvText);
        if (rows.length < 2) return [];
        const seen = new Set();
        const list = [];
        for (let i = 1; i < rows.length; i++) {
          const name = (rows[i][0] || '').trim();
          const email = (rows[i][1] || '').trim();
          if (!name || !email) continue;
          if (!email.toLowerCase().endsWith('@ucsb.edu')) continue;
          const key = candidateKey(name, email);
          if (seen.has(key)) continue;
          seen.add(key);
          list.push({ name, email });
        }
        return list;
      }

      function getDrawnKeys() {
        const keys = new Set();
        lotteryResults.forEach((result) => {
          result.winners.forEach((w) => keys.add(candidateKey(w.name, w.email)));
        });
        return keys;
      }

      function rebuildAvailableCandidates() {
        const drawn = getDrawnKeys();
        availableCandidates = allValidCandidates.filter(
          (c) => !drawn.has(candidateKey(c.name, c.email))
        );
      }

      function saveLotteryState() {
        const payload = {
          lotteryResults,
          currentDrawIndex,
          allValidCandidates,
          prizes,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      function loadLotteryState() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return;
        try {
          const data = JSON.parse(stored);
          lotteryResults = Array.isArray(data.lotteryResults) ? data.lotteryResults : [];
          currentDrawIndex = Number.isFinite(data.currentDrawIndex) ? data.currentDrawIndex : 0;
          allValidCandidates = Array.isArray(data.allValidCandidates)
            ? data.allValidCandidates
            : [];
          prizes = Array.isArray(data.prizes) ? data.prizes : [];
          drawOrder = [...prizes].reverse();
          rebuildAvailableCandidates();
        } catch (e) {
          console.error('Failed to load lottery state', e);
        }
      }

      function getCurrentPrize() {
        if (currentDrawIndex < 0 || currentDrawIndex >= drawOrder.length) return null;
        return drawOrder[currentDrawIndex];
      }

      function updateUI() {
        const candidatesInfo = document.getElementById('candidatesInfo');
        const drawBtn = document.getElementById('drawBtn');
        const prizeIdle = document.getElementById('prizeIdle');
        const prizeActive = document.getElementById('prizeActive');
        const prizeDone = document.getElementById('prizeDone');

        const hasData = allValidCandidates.length > 0 || prizes.length > 0;
        candidatesInfo.style.display = hasData ? 'block' : 'none';
        document.getElementById('validCount').textContent = allValidCandidates.length;
        document.getElementById('availableCount').textContent = availableCandidates.length;
        document.getElementById('drawnCount').textContent = getDrawnKeys().size;
        document.getElementById('prizeTierCount').textContent = prizes.length;

        const current = getCurrentPrize();
        const allDone = drawOrder.length > 0 && currentDrawIndex >= drawOrder.length;

        if (!drawOrder.length) {
          prizeIdle.style.display = 'block';
          prizeIdle.textContent = '请先点击左上角「同步数据」';
          prizeActive.style.display = 'none';
          prizeDone.style.display = 'none';
          drawBtn.disabled = true;
          drawBtn.textContent = '🎰 开始抽奖';
        } else if (showingResults && allDone) {
          prizeIdle.style.display = 'none';
          prizeActive.style.display = 'none';
          prizeDone.style.display = 'block';
          drawBtn.disabled = true;
          drawBtn.textContent = '抽奖已经结束';
        } else if (showingResults) {
          // Keep showing the prize that was just drawn (previous index)
          const last = lotteryResults[lotteryResults.length - 1];
          prizeIdle.style.display = 'none';
          prizeDone.style.display = 'none';
          prizeActive.style.display = 'block';
          if (last) {
            document.getElementById('currentPrizeLevel').textContent = last.level;
            document.getElementById('currentPrizeName').textContent = last.name;
            document.getElementById('currentPrizeCount').textContent = last.count;
          }
          drawBtn.disabled = false;
          drawBtn.textContent = '准备下个抽奖';
        } else if (allDone) {
          prizeIdle.style.display = 'none';
          prizeActive.style.display = 'none';
          prizeDone.style.display = 'block';
          drawBtn.disabled = true;
          drawBtn.textContent = '抽奖已经结束';
        } else {
          prizeIdle.style.display = 'none';
          prizeDone.style.display = 'none';
          prizeActive.style.display = 'block';
          document.getElementById('currentPrizeLevel').textContent = current.level;
          document.getElementById('currentPrizeName').textContent = current.name;
          document.getElementById('currentPrizeCount').textContent = current.count;
          const canDraw =
            !isDrawing &&
            availableCandidates.length >= current.count &&
            current.count > 0;
          drawBtn.disabled = !canDraw;
          drawBtn.textContent = `🎰 抽取 ${current.level}（${current.count}人）`;
        }

        renderHistory();
      }

      function renderHistory() {
        const list = document.getElementById('historyList');
        if (!lotteryResults.length) {
          list.innerHTML = '<p class="empty">暂无开奖记录</p>';
          return;
        }
        list.innerHTML = lotteryResults
          .map((r) => {
            const names = r.winners.map((w) => w.name).join('、');
            return `<div class="history-item"><strong>${escapeHtml(r.level)}</strong> · ${escapeHtml(r.name)}（${r.count}）— ${escapeHtml(names)}</div>`;
          })
          .join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function showNotification(message, durationMs) {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.style.display = 'block';
        setTimeout(() => {
          notification.style.display = 'none';
        }, durationMs || 3500);
      }

      function calculateFontSize(text, maxWidth) {
        const baseSize = 28;
        const minSize = 14;
        const charWidth = 18;
        const estimatedWidth = text.length * charWidth;
        if (estimatedWidth <= maxWidth) return baseSize;
        return Math.floor(Math.max(baseSize * (maxWidth / estimatedWidth), minSize));
      }

      async function syncData() {
        const syncBtn = document.getElementById('syncBtn');
        syncBtn.disabled = true;
        try {
          showNotification('📥 正在同步 input.env 与表格数据...');

          const envRes = await fetch('input.env?t=' + Date.now());
          if (!envRes.ok) throw new Error('无法读取 input.env');
          const env = parseEnv(await envRes.text());
          prizeListUrl = env.PRIZE_LIST || '';
          candidateListUrl = env.CANDIDATE_LIST || '';
          if (!prizeListUrl || !candidateListUrl) {
            throw new Error('input.env 缺少 PRIZE_LIST 或 CANDIDATE_LIST');
          }

          const [prizeRes, candidateRes] = await Promise.all([
            fetch(prizeListUrl),
            fetch(candidateListUrl),
          ]);
          if (!prizeRes.ok || !candidateRes.ok) {
            throw new Error('表格数据请求失败');
          }

          const [prizeText, candidateText] = await Promise.all([
            prizeRes.text(),
            candidateRes.text(),
          ]);

          prizes = parsePrizes(prizeText);
          drawOrder = [...prizes].reverse();
          allValidCandidates = parseCandidates(candidateText);

          // Keep progress if prizes still match previous draw steps; otherwise restart index safely
          if (currentDrawIndex > drawOrder.length) currentDrawIndex = drawOrder.length;
          rebuildAvailableCandidates();
          saveLotteryState();
          updateUI();

          showNotification(
            `✅ 同步完成：有效候选人 ${allValidCandidates.length} 人，奖品档次 ${prizes.length} 个`,
            4500
          );

          document.getElementById('results').style.display = 'none';
          document.getElementById('slotMachine').style.display = 'none';
          // keep showingResults as-is only if mid-round; after sync stay on current prize ready state
          if (showingResults) {
            showingResults = false;
            updateUI();
          }
        } catch (error) {
          console.error(error);
          showNotification('❌ 同步失败：' + (error.message || '请检查网络与 input.env'));
        } finally {
          syncBtn.disabled = false;
        }
      }

      function startLottery() {
        if (isDrawing) return;
        const prize = getCurrentPrize();
        if (!prize) {
          showNotification('❌ 没有待抽取的奖项，请先同步数据');
          return;
        }
        if (availableCandidates.length < prize.count) {
          showNotification(
            `❌ 候选人不足：需要 ${prize.count} 人，剩余 ${availableCandidates.length} 人`
          );
          return;
        }

        isDrawing = true;
        document.getElementById('drawBtn').disabled = true;
        document.getElementById('results').style.display = 'none';

        const slotMachine = document.getElementById('slotMachine');
        const slotContainer = document.getElementById('slotContainer');
        slotMachine.style.display = 'block';
        slotContainer.innerHTML = '';

        for (let i = 0; i < prize.count; i++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.innerHTML = `
            <div class="slot-name" id="slotName${i}">???</div>
            <div class="slot-email" id="slotEmail${i}">???</div>
          `;
          slotContainer.appendChild(slot);
        }

        triggerFireworks();

        rollingInterval = setInterval(() => {
          for (let i = 0; i < prize.count; i++) {
            const randomCandidate =
              availableCandidates[Math.floor(Math.random() * availableCandidates.length)];
            const slotNameEl = document.getElementById(`slotName${i}`);
            slotNameEl.textContent = randomCandidate.name;
            const slotWidth = slotNameEl.parentElement.offsetWidth - 28;
            slotNameEl.style.fontSize = calculateFontSize(randomCandidate.name, slotWidth) + 'px';
            document.getElementById(`slotEmail${i}`).textContent = randomCandidate.email;
          }
        }, 100);

        setTimeout(() => {
          clearInterval(rollingInterval);
          finishDraw(prize);
        }, 3000);
      }

      function finishDraw(prize) {
        stopFireworks();

        const pool = [...availableCandidates];
        const winners = [];
        for (let i = 0; i < prize.count; i++) {
          const randomIndex = Math.floor(Math.random() * pool.length);
          const winner = pool.splice(randomIndex, 1)[0];
          winners.push(winner);

          const slotNameEl = document.getElementById(`slotName${i}`);
          slotNameEl.textContent = winner.name;
          slotNameEl.style.animation = 'none';
          const slotWidth = slotNameEl.parentElement.offsetWidth - 28;
          slotNameEl.style.fontSize = calculateFontSize(winner.name, slotWidth) + 'px';
          document.getElementById(`slotEmail${i}`).textContent = winner.email;
        }

        lotteryResults.push({
          level: prize.level,
          name: prize.name,
          count: prize.count,
          winners,
        });
        currentDrawIndex += 1;
        rebuildAvailableCandidates();
        saveLotteryState();

        setTimeout(() => {
          document.getElementById('slotMachine').style.display = 'none';
          const results = document.getElementById('results');
          const winnersList = document.getElementById('winnersList');
          document.getElementById('resultsTitle').textContent =
            `🎉 ${prize.level} · ${prize.name} 🎉`;
          winnersList.innerHTML = '';

          winners.forEach((winner, index) => {
            const card = document.createElement('div');
            card.className = 'winner-card';
            card.style.animationDelay = `${index * 0.08}s`;
            card.innerHTML = `
              <h3 class="winner-name">🎊 ${escapeHtml(winner.name)}</h3>
              <p>📧 ${escapeHtml(winner.email)}</p>
            `;
            winnersList.appendChild(card);
            setTimeout(() => {
              const nameEl = card.querySelector('.winner-name');
              const cardWidth = card.offsetWidth - 32;
              nameEl.style.fontSize = calculateFontSize(winner.name, cardWidth) + 'px';
            }, 50);
          });

          results.style.display = 'block';
          isDrawing = false;
          showingResults = true;
          updateUI();
          showNotification(`✅ ${prize.level} 抽取完成！`, 2500);
        }, 900);
      }

      function csvEscape(value) {
        const s = String(value ?? '');
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      }

      function exportPrizeResultsCsv() {
        closeMenu();
        if (!lotteryResults.length) {
          showNotification('❌ 暂无抽奖结果可导出');
          return;
        }

        const lines = [['奖品等级', '奖品名称', '姓名', '邮箱'].map(csvEscape).join(',')];
        lotteryResults.forEach((result) => {
          result.winners.forEach((w) => {
            lines.push(
              [result.level, result.name, w.name, w.email].map(csvEscape).join(',')
            );
          });
        });

        const blob = new Blob(['\uFEFF' + lines.join('\n')], {
          type: 'text/csv;charset=utf-8;',
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `welcome-night-lottery-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification('✅ 抽奖结果 CSV 已导出');
      }

      function showClearModal() {
        closeMenu();
        document.getElementById('clearModal').style.display = 'flex';
      }

      function closeClearModal() {
        document.getElementById('clearModal').style.display = 'none';
      }

      function confirmClear() {
        lotteryResults = [];
        currentDrawIndex = 0;
        showingResults = false;
        rebuildAvailableCandidates();
        if (prizes.length || allValidCandidates.length) {
          saveLotteryState();
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
        closeClearModal();
        document.getElementById('results').style.display = 'none';
        document.getElementById('slotMachine').style.display = 'none';
        updateUI();
        showNotification('✅ 抽奖数据已清除，将从最低奖项重新开始');
      }

      function initFireworks() {
        const canvas = document.getElementById('fireworks');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });
      }

      function triggerFireworks() {
        if (fireworksActive) return;
        fireworksActive = true;
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function createFirework() {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height * 0.5;
          const colors = ['#FFD700', '#FF6347', '#FFA500', '#FF1493', '#00FF00'];
          const color = colors[Math.floor(Math.random() * colors.length)];
          for (let i = 0; i < 30; i++) {
            particles.push({
              x,
              y,
              vx: (Math.random() - 0.5) * 8,
              vy: (Math.random() - 0.5) * 8,
              life: 100,
              color,
            });
          }
        }

        function animate() {
          if (!fireworksActive) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
          }
          ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life--;
            if (p.life <= 0) {
              particles.splice(i, 1);
              continue;
            }
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (fireworksActive) animationFrameId = requestAnimationFrame(animate);
        }

        fireworkInterval = setInterval(createFirework, 300);
        animate();
      }

      function stopFireworks() {
        fireworksActive = false;
        if (fireworkInterval) {
          clearInterval(fireworkInterval);
          fireworkInterval = null;
        }
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    </script>
  </body>
</html>
